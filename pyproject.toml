[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dentate-graph-vae"
version = "0.1.0"
description = "Graph-aware token VAE for dentate-gyrus single-cell counts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "h5py>=3.8",
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.1",
    "torchmetrics>=1.2",
]

[project.optional-dependencies]
tracking = ["wandb>=0.16"]
dev = ["pytest>=7"]

[project.scripts]
dentate-graph-vae = "dentate_graph_vae.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
